#
# This workflow compiles CUDA code on GitHub-hosted runners (ubuntu-latest).
# CUDA compilation (nvcc) works WITHOUT GPU hardware - only needs CUDA toolkit.
# GPU runtime execution requires actual GPU, so tests are commented out.
#
name: rust-gpu

on:
  pull_request:
    branches:
      - main
    paths:
      - 'c/sedona-libgpuspatial/**'
      - 'rust/sedona-spatial-join-gpu/**'
      - '.github/workflows/rust-gpu.yml'

  push:
    branches:
      - main
    paths:
      - 'c/sedona-libgpuspatial/**'
      - 'rust/sedona-spatial-join-gpu/**'
      - '.github/workflows/rust-gpu.yml'

concurrency:
  group: ${{ github.repository }}-${{ github.ref }}-${{ github.workflow }}-rust-gpu
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash -l -eo pipefail {0}

# Set workflow timeout to 90 minutes for CUDA compilation
# Expected: ~45-60 minutes first time, ~10-15 minutes cached
env:
  WORKFLOW_TIMEOUT_MINUTES: 90
  # At s2geometry updated to 0.13.0
  VCPKG_REF: 580d480f750618f8affeb77abbb956e6eeaee0ce

jobs:
  rust-gpu-build:
    # Using GitHub-hosted runner to compile CUDA code
    # CUDA compilation works without GPU hardware (only needs CUDA toolkit)
    # GPU tests are skipped (no GPU hardware for runtime execution)
    # TODO: Once GPU runner is ready, enable GPU tests with:
    #   runs-on: [self-hosted, gpu, linux, cuda]
    strategy:
      fail-fast: false
      matrix:
        name: [ "clippy", "build" ]

    name: "${{ matrix.name }}"
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      CARGO_INCREMENTAL: 0
      # Disable debug info completely to save disk space
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_PROFILE_TEST_DEBUG: 0
      # Limit parallel compilation to reduce memory pressure (GPU compilation is intensive)
      CARGO_BUILD_JOBS: 4
      CUDA_HOME: /usr/local/cuda
      CMAKE_CUDA_ARCHITECTURES: 75
      LIBRARY_PATH: /usr/local/cuda/lib64/stubs:/usr/local/cuda/targets/x86_64-linux/lib/stubs

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'recursive'

      - name: Clone vcpkg
        uses: actions/checkout@v7
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_REF }}
          path: vcpkg

      # Set up environment variables for vcpkg and CUDA
      - name: Set up environment variables and bootstrap vcpkg
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          CMAKE_TOOLCHAIN_FILE: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
        run: |
          cd vcpkg
          ./bootstrap-vcpkg.sh
          cd ..
          echo "VCPKG_ROOT=$VCPKG_ROOT" >> $GITHUB_ENV
          echo "PATH=$VCPKG_ROOT:$PATH" >> $GITHUB_ENV
          echo "CMAKE_TOOLCHAIN_FILE=$CMAKE_TOOLCHAIN_FILE" >> $GITHUB_ENV
          echo "CUDA_HOME=/usr/local/cuda" >> $GITHUB_ENV
          echo "/usr/local/cuda/bin" >> $GITHUB_PATH

      - name: Free Disk Space (Ubuntu)
        uses: jlumbroso/free-disk-space@main
        with:
          # Free up space by removing tools we don't need
          tool-cache: false  # Keep tool cache as we need build tools
          android: true      # Remove Android SDK (not needed)
          dotnet: true       # Remove .NET runtime (not needed)
          haskell: true      # Remove Haskell toolchain (not needed)
          large-packages: false  # Keep essential packages including build-essential
          swap-storage: true     # Remove swap file to free space
          docker-images: true    # Remove docker images (not needed)

      # Install system dependencies including CUDA toolkit for compilation
      - name: Install system dependencies
        run: |
          sudo apt-get update

          # Install transport tools for Kitware CMake (needed for newer CMake)
          sudo apt-get install -y apt-transport-https ca-certificates gnupg software-properties-common wget

          # Add Kitware repository for CMake
          test -f /usr/share/doc/kitware-archive-keyring/copyright ||
            wget -O - https://apt.kitware.com/keys/kitware-archive-latest.asc 2>/dev/null | gpg --dearmor - | sudo tee /usr/share/keyrings/kitware-archive-keyring.gpg >/dev/null
          echo "deb [signed-by=/usr/share/keyrings/kitware-archive-keyring.gpg] https://apt.kitware.com/ubuntu/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/kitware.list >/dev/null
          sudo apt-get update

          # Install build tools and dependencies
          sudo apt-get install -y build-essential pkg-config cmake ninja-build flex bison libclang-dev libgeos-dev

          # Ensure GCC 14 is used (Ubuntu 26.04 ships with GCC 15/16 which breaks snappy and nvcc host compiler)
          if apt-cache show gcc-14 >/dev/null 2>&1; then
            sudo apt-get install -y gcc-14 g++-14
            sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-14 100 --slave /usr/bin/g++ g++ /usr/bin/g++-14
            sudo update-alternatives --set gcc /usr/bin/gcc-14
            echo "CC=gcc-14" >> $GITHUB_ENV
            echo "CXX=g++-14" >> $GITHUB_ENV
            echo "CUDAHOSTCXX=/usr/bin/g++-14" >> $GITHUB_ENV
          fi

          # Verify compiler versions
          gcc --version
          g++ --version
          cmake --version

          # Add NVIDIA repository and install CUDA
          UBUNTU_REPO="ubuntu$(lsb_release -rs | tr -d '.')"
          wget "https://developer.download.nvidia.com/compute/cuda/repos/${UBUNTU_REPO}/x86_64/cuda-keyring_1.1-1_all.deb"
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update

          # Remove conflicting older toolkits and install CUDA toolkit
          sudo apt-get purge cuda-toolkit* -y || true
          if apt-cache show cuda-toolkit-12-8 >/dev/null 2>&1; then
            sudo apt-get install -y cuda-toolkit-12-8
          else
            sudo apt-get install -y cuda-toolkit
          fi

          # Ensure /usr/local/cuda symlink exists
          CUDA_DIR=$(find /usr/local -maxdepth 1 -type d -name "cuda-[0-9]*" | sort -V | tail -n 1)
          if [ -n "$CUDA_DIR" ]; then
            sudo ln -sfn "$CUDA_DIR" /usr/local/cuda
          fi

          # Ensure nvcc is on PATH
          echo "/usr/local/cuda/bin" >> $GITHUB_PATH
          echo "CUDA_HOME=/usr/local/cuda" >> $GITHUB_ENV
          /usr/local/cuda/bin/nvcc --version

          # Link CUDA driver stub for linking without physical GPU hardware
          CUDA_STUB=$(find /usr/local/cuda* -name "libcuda.so" 2>/dev/null | grep stubs | head -n 1)
          echo "Found CUDA stub at: $CUDA_STUB"
          if [ -n "$CUDA_STUB" ]; then
            sudo ln -sf "$CUDA_STUB" /usr/lib/x86_64-linux-gnu/libcuda.so
            sudo ln -sf "$CUDA_STUB" /usr/lib/x86_64-linux-gnu/libcuda.so.1
            sudo ln -sf "$CUDA_STUB" /usr/local/cuda/lib64/libcuda.so || true
          fi

          # Patch math_functions.h if glibc has noexcept on rsqrt/rsqrtf
          if [ -f /usr/local/cuda/targets/x86_64-linux/include/crt/math_functions.h ]; then
            if grep -q "rsqrtf.*noexcept" /usr/include/x86_64-linux-gnu/bits/mathcalls.h 2>/dev/null; then
              echo "Patching math_functions.h for glibc noexcept compatibility..."
              sudo sed -i 's/double rsqrt(double x);/double rsqrt(double x) noexcept (true);/g' /usr/local/cuda/targets/x86_64-linux/include/crt/math_functions.h
              sudo sed -i 's/float rsqrtf(float x);/float rsqrtf(float x) noexcept (true);/g' /usr/local/cuda/targets/x86_64-linux/include/crt/math_functions.h
            fi
          fi


      # Cache vcpkg installed packages (expensive to rebuild)
      - name: Cache vcpkg binaries
        id: cache-vcpkg
        uses: actions/cache@v6
        with:
          path: vcpkg/packages
          # Bump the number at the end of this line to force a new dependency build
          key: vcpkg-installed-${{ runner.os }}-${{ runner.arch }}-${{ env.VCPKG_REF }}-4

      # Install vcpkg dependencies from vcpkg.json manifest
      - name: Install vcpkg dependencies
        if: steps.cache-vcpkg.outputs.cache-hit != 'true'
        run: |
          ./vcpkg/vcpkg install abseil openssl
          # Clean up vcpkg buildtrees and downloads to save space
          rm -rf vcpkg/buildtrees
          rm -rf vcpkg/downloads

      - name: Use stable Rust
        id: rust
        run: |
          rustup toolchain install stable --no-self-update
          rustup default stable
          rustup component add clippy

      - uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "rust-gpu-cuda"

      # Build WITH GPU feature to compile CUDA code
      # CUDA compilation (nvcc) works without GPU hardware
      # Only GPU runtime execution requires actual GPU
      - name: Check libgpuspatial (with CUDA compilation)
        run: |
          echo "=== Building libgpuspatial WITH GPU feature ==="
          echo "Compiling CUDA code using nvcc (no GPU hardware needed for compilation)"
          echo "Note: First build with CUDA takes 45-60 minutes (CMake + CUDA compilation)"
          echo "Subsequent builds: 10-15 minutes (cached)"
          echo ""
          echo "Build started at: $(date)"
          set +e
          # Check the library only (skip tests - they require CUDA driver which isn't available)
          if [[ "${{ matrix.name }}" == "clippy" ]]; then
            cargo clippy --locked --package sedona-libgpuspatial --lib --features gpu -- -Dwarnings 2>&1 | tee /tmp/cargo.log
            STATUS=${PIPESTATUS[0]}
          else
            cargo build --locked --package sedona-libgpuspatial --lib --features gpu --verbose 2>&1 | tee /tmp/cargo.log
            STATUS=${PIPESTATUS[0]}
          fi
          if [ $STATUS -ne 0 ]; then
            MSG=$(tail -n 40 /tmp/cargo.log | awk '{printf "%s%%0A", $0}')
            echo "::error::CARGO_LOG: $MSG"
            find target/debug/build -name "*.log" 2>/dev/null | while read logfile; do
              FMSG=$(tail -n 30 "$logfile" | awk '{printf "%s%%0A", $0}')
              echo "::error::FILE $logfile: $FMSG"
            done
            exit $STATUS
          fi

      - name: Build libgpuspatial Tests
        run: |
          echo "=== Building libgpuspatial tests ==="
          cd c/sedona-libgpuspatial/libgpuspatial
          mkdir -p build
          set +e
          cmake --preset=default-with-tests -S . -B build -DCMAKE_CUDA_ARCHITECTURES=75 2>&1 | tee /tmp/cmake_config.log
          STATUS=${PIPESTATUS[0]}
          if [ $STATUS -ne 0 ]; then
            MSG=$(tail -n 40 /tmp/cmake_config.log | awk '{printf "%s%%0A", $0}')
            echo "::error::CMake configure failed with status $STATUS: $MSG"
            find build -name "*.log" 2>/dev/null | while read logfile; do
              FMSG=$(tail -n 30 "$logfile" | awk '{printf "%s%%0A", $0}')
              echo "::error::FILE $logfile: $FMSG"
            done
            echo "### CMake Configure Failed ($STATUS)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 200 /tmp/cmake_config.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $STATUS
          fi
          cmake --build build --target all 2>&1 | tee /tmp/cmake_build.log
          STATUS=${PIPESTATUS[0]}
          if [ $STATUS -ne 0 ]; then
            MSG=$(tail -n 40 /tmp/cmake_build.log | awk '{printf "%s%%0A", $0}')
            echo "::error::CMake build failed with status $STATUS: $MSG"
            echo "### CMake Build Failed ($STATUS)" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -n 200 /tmp/cmake_build.log >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            exit $STATUS
          fi

name: python-wheels

on:
  pull_request:
    branches:
      - main
    paths:
      - 'ci/scripts/wheels-*'
      - '.github/workflows/python-wheels.yml'
      - '.github/workflows/wheels-expr.yml'
      - '.github/workflows/wheels-geopandas.yml'
      - '.github/workflows/wheels-zarr.yml'
      - '.github/actions/setup-wheel-build/**'
  push:
    branches:
      - main
      - 'branch-**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.repository }}-${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

env:
  # At s2geometry updated to 0.13.0
  VCPKG_REF: 580d480f750618f8affeb77abbb956e6eeaee0ce

jobs:
  windows-x86_64:
    runs-on: windows-2022
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'true'
          fetch-depth: 0

      - uses: ./.github/actions/setup-wheel-build
        with:
          rust-cache-key: "python-wheel-windows-latest-v3"
          delvewheel: "true"

      - name: Clone vcpkg
        uses: actions/checkout@v7
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_REF }}
          path: vcpkg

      # Persist vcpkg's built binaries across runs. The pinned VCPKG_REF and
      # custom triplets fully determine what gets built, so a hit turns the
      # ~40-minute `vcpkg install` into a seconds-long unpack. Restore and save
      # are split so the cache is written even when the build/test step fails —
      # a failing build still produces reusable binaries, and the combined
      # cache action skips its save on job failure.
      - name: Restore vcpkg binaries
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/vcpkg-bincache
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ env.VCPKG_REF }}-${{ hashFiles('ci/scripts/custom-triplets/**', 'ci/scripts/wheels-build-windows.ps1') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ env.VCPKG_REF }}-

      - name: Build and test wheels (sedonadb)
        run: |
          New-Item -ItemType Directory -Force -Path "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null
          cd ci/scripts
          .\wheels-build-windows.ps1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          VCPKG_DEFAULT_TRIPLET: x64-windows-dynamic-release
          VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-bincache
          CMAKE_TOOLCHAIN_FILE: ${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake
          CIBW_BUILD: "*-win_amd64"
          CIBW_TEST_REQUIRES: pytest adbc_driver_manager geoarrow-pyarrow geopandas
          # A test failure stops cibuildwheel immediately, so this job cannot
          # upload wheels from a failed or incomplete build.
          CIBW_TEST_COMMAND: "python -m pytest {package}/tests -vv -o faulthandler_timeout=600"

      # Save even on failure (hence a standalone save step gated only on a miss):
      # binaries built before a later test failure stay cached for the next run.
      - name: Save vcpkg binaries
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/vcpkg-bincache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@v7
        with:
          name: release-wheels-windows-x86_64
          path: python/sedonadb/dist/*.whl

  macOS-arm64:
    runs-on: macOS-latest
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'true'
          fetch-depth: 0

      - uses: ./.github/actions/setup-wheel-build
        with:
          rust-cache-key: "python-wheel-macOS-latest-v2"
          cache-bin: "false"

      - name: Clone vcpkg
        uses: actions/checkout@v7
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_REF }}
          path: vcpkg

      # Persist vcpkg's built binaries across runs. The pinned VCPKG_REF and
      # custom triplets fully determine what gets built, so a hit turns the
      # ~40-minute `vcpkg install` into a seconds-long unpack. Restore and save
      # are split so the cache is written even when the build/test step fails —
      # a failing build still produces reusable binaries, and the combined
      # cache action skips its save on job failure.
      - name: Restore vcpkg binaries
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/vcpkg-bincache
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ env.VCPKG_REF }}-${{ hashFiles('ci/scripts/custom-triplets/**', 'ci/scripts/wheels-bootstrap-vcpkg.sh') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ env.VCPKG_REF }}-

      - name: Build and test wheels (sedonadb)
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          cd ci/scripts
          ./wheels-build-macos.sh sedonadb
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-bincache
          CIBW_TEST_REQUIRES: pytest adbc_driver_manager geoarrow-pyarrow geopandas duckdb
          # A test failure stops cibuildwheel immediately, so this job cannot
          # upload wheels from a failed or incomplete build.
          CIBW_TEST_COMMAND: "python -m pytest {package}/tests -vv -o faulthandler_timeout=600"

      - name: Save vcpkg binaries
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/vcpkg-bincache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@v7
        with:
          name: release-wheels-macOS-arm64
          path: python/sedonadb/dist/*.whl

  macOS-amd64:
    runs-on: macos-15-intel
    timeout-minutes: 150

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'true'
          fetch-depth: 0

      - uses: ./.github/actions/setup-wheel-build
        with:
          rust-cache-key: "python-wheel-macOS-latest-v2"
          cache-bin: "false"

      - name: Clone vcpkg
        uses: actions/checkout@v7
        with:
          repository: microsoft/vcpkg
          ref: ${{ env.VCPKG_REF }}
          path: vcpkg

      # Persist vcpkg's built binaries across runs. The pinned VCPKG_REF and
      # custom triplets fully determine what gets built, so a hit turns the
      # ~40-minute `vcpkg install` into a seconds-long unpack. Restore and save
      # are split so the cache is written even when the build/test step fails —
      # a failing build still produces reusable binaries, and the combined
      # cache action skips its save on job failure.
      - name: Restore vcpkg binaries
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/vcpkg-bincache
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ env.VCPKG_REF }}-${{ hashFiles('ci/scripts/custom-triplets/**', 'ci/scripts/wheels-bootstrap-vcpkg.sh') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ env.VCPKG_REF }}-

      - name: Build and test wheels (sedonadb)
        run: |
          mkdir -p "$VCPKG_DEFAULT_BINARY_CACHE"
          cd ci/scripts
          ./wheels-build-macos.sh sedonadb
        env:
          VCPKG_ROOT: ${{ github.workspace }}/vcpkg
          VCPKG_DEFAULT_BINARY_CACHE: ${{ github.workspace }}/vcpkg-bincache
          CIBW_TEST_REQUIRES: pytest adbc_driver_manager geoarrow-pyarrow geopandas duckdb
          # A test failure stops cibuildwheel immediately, so this job cannot
          # upload wheels from a failed or incomplete build.
          CIBW_TEST_COMMAND: "python -m pytest {package}/tests -vv -o faulthandler_timeout=600"
          SEDONADB_MACOS_ARCH: x86_64

      - name: Save vcpkg binaries
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/vcpkg-bincache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@v7
        with:
          name: release-wheels-macOS-amd64
          path: python/sedonadb/dist/*.whl

  wheels-linux:
    name: ${{ matrix.config.label }}
    runs-on: ${{ matrix.config.os }}
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: "ubuntu-latest", label: "linux-x86_64", arch: "x86_64"}
          - {os: "ubuntu-24.04-arm", label: "linux-arm64", arch: "aarch64"}

    steps:
      - uses: actions/checkout@v7
        with:
          submodules: 'true'
          fetch-depth: 0

      - uses: ./.github/actions/setup-wheel-build

      # Persist vcpkg's built binaries across runs. vcpkg runs inside the
      # manylinux container, so wheels-build-linux.sh bind-mounts this host
      # directory in and points VCPKG_DEFAULT_BINARY_CACHE at it; a hit turns
      # the from-source `vcpkg install` into a seconds-long unpack. Restore and
      # save are split so the cache is written even when the build/test step
      # fails, and the combined cache action skips its save on job failure.
      - name: Restore vcpkg binaries
        id: vcpkg-cache
        uses: actions/cache/restore@v6
        with:
          path: ${{ github.workspace }}/vcpkg-bincache
          key: vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ env.VCPKG_REF }}-${{ hashFiles('ci/scripts/custom-triplets/**', 'ci/scripts/wheels-bootstrap-vcpkg.sh') }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ runner.arch }}-${{ env.VCPKG_REF }}-

      - name: Build and test wheels (sedonadb)
        run: |
          cd ci/scripts
          ./wheels-build-linux.sh ${{ matrix.config.arch }} sedonadb
        env:
          CIBW_SKIP: "*musllinux*"
          VCPKG_BINARY_CACHE_HOST: ${{ github.workspace }}/vcpkg-bincache
          CIBW_TEST_REQUIRES: pytest adbc_driver_manager geoarrow-pyarrow geopandas duckdb
          # A test failure stops cibuildwheel immediately, so this job cannot
          # upload wheels from a failed or incomplete build.
          CIBW_TEST_COMMAND: "python -m pytest {package}/tests -vv -o faulthandler_timeout=600"

      - name: Save vcpkg binaries
        if: always() && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: ${{ github.workspace }}/vcpkg-bincache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}

      - uses: actions/upload-artifact@v7
        with:
          name: release-wheels-${{ matrix.config.label }}
          path: python/sedonadb/dist/*.whl

  # Extension wheels build in their own reusable workflow, gated on the
  # sedonadb jobs (so they run in the same run and can download those wheels
  # to test against) but isolated so an extension failure can't block the
  # core package's nightly. Future extensions follow the same shape. The
  # default success gate prevents extensions from consuming partial artifacts.
  expr:
    needs: ["windows-x86_64", "macOS-arm64", "macOS-amd64", "wheels-linux"]
    uses: ./.github/workflows/wheels-expr.yml
    secrets: inherit

  zarr:
    needs: ["windows-x86_64", "macOS-arm64", "macOS-amd64", "wheels-linux"]
    uses: ./.github/workflows/wheels-zarr.yml
    secrets: inherit

  # Follows the expr job rather than the core wheel jobs directly: this package
  # needs the sedonadb-expr wheel (for the `.geo` accessor) in addition to the
  # core wheels, and expr already waits on those.
  #
  geopandas:
    needs: ["expr"]
    uses: ./.github/workflows/wheels-geopandas.yml
    secrets: inherit

  upload_nightly:
    needs: ["wheels-linux", "macOS-arm64", "macOS-amd64", "windows-x86_64"]
    # The default success gate prevents publishing a partial wheel set when
    # any platform fails to build or test.
    name: Upload nightly packages
    runs-on: "macos-latest"
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: release-wheels-*
          merge-multiple: true
          path: dist

      - name: Install gemfury client
        run: |
          brew tap gemfury/tap
          brew trust gemfury/tap
          brew install fury-cli
          fury --version

      - name: Upload packages to Gemfury
        if: github.repository == 'apache/sedona-db' && github.ref == 'refs/heads/main'
        shell: bash
        run: |
          if [ -z "$(ls -A dist 2>/dev/null)" ]; then
            echo "No wheels built successfully this run; nothing to upload."
            exit 0
          fi
          echo "Uploading nightly wheels:"
          ls -1 dist
          fury push \
            --api-token=${GEMFURY_PUSH_TOKEN} \
            --as="sedona-nightlies" \
            dist/*
        env:
          GEMFURY_PUSH_TOKEN: ${{ secrets.GEMFURY_PUSH_TOKEN }}

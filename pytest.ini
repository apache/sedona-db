[pytest]
# An xfail that starts passing is a result, not a non-event: it means the
# behaviour it describes has changed — usually because an upstream fix landed —
# and the marker is now lying about the state of the world. Strict turns that
# into a failure naming the test, so the reason gets rewritten or the marker
# removed while the cause is still fresh. Without it pytest reports XPASS and
# exits 0, and stale reasons accumulate silently.
#
# Lives at the repo root because CI runs each suite from its own directory
# (see .github/workflows/python.yml); pytest walks up from there, so one file
# covers every suite, including ones added later.
xfail_strict = true

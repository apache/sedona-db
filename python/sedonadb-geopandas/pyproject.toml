[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sedonadb-geopandas"
description = "GeoPandas-compatible API on top of SedonaDB"
readme = "README.md"
requires-python = ">=3.9"
dynamic = ["version"]
dependencies = [
    # 0.6.0 is the first release with what this wrapper relies on since 0.5.0:
    # ST_KNN's include_tie_breakers argument, which sjoin_nearest() passes;
    # engine fixes its results depend on, among them affine transformations,
    # has_z/has_m of collections and the coordinates of collections mixing
    # dimensions; and sedonadb-expr's shortest_line. Nightlies version as
    # 0.6.0aN, below 0.6.0, so the floor is the first of them.
    "sedonadb>=0.6.0a0",
    "sedonadb-expr>=0.6.0a0",
    "pyarrow",
    # Geometry scalars (assignment, comparison operands) are Shapely objects;
    # Shapely 2 dropped the sequence protocol on multipart geometries, which
    # is what lets a geometry be told apart from an array-like generically.
    "shapely>=2",
    # CRS handling goes through pyproj: a user CRS is parsed to PROJJSON so the
    # engine keeps it as given (it canonicalizes "EPSG:4326" to OGC:CRS84), and
    # a CRS read back from the engine may need it to serialize. GeoPandas
    # requires it as well.
    "pyproj>=3.5",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
# GeoPandas interop is opt-in rather than a hard dependency. It routes through
# sedonadb's pandas/GeoPandas conversion, which needs geoarrow-pyarrow as well
# as geopandas itself — without it, anything calling to_geopandas() fails with
# `ModuleNotFoundError: No module named 'geoarrow'`.
#
# These are listed directly rather than as `sedonadb[geopandas]` so that
# installing this package can never cause pip to re-resolve sedonadb itself:
# in CI sedonadb is an editable build from source, and a resolver that decided
# to satisfy it from PyPI instead would quietly stop testing the source tree.
geopandas = [
    "geopandas",
    "geoarrow-pyarrow",
]
test = [
    "pytest",
    "pandas",
    "geopandas",
    "geoarrow-pyarrow",
    # plot() is compared with GeoPandas' plots.
    "matplotlib",
]

[tool.hatch.version]
source = "code"
path = "_version.py"
expression = "get_version()"

[tool.hatch.build.targets.wheel]
packages = ["python/sedonadb_geopandas"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "sedonadb-geopandas"
description = "GeoPandas-compatible API on top of SedonaDB"
readme = "README.md"
requires-python = ">=3.9"
dynamic = ["version"]
dependencies = [
    # The `.geo` accessor and `DataFrame.unnest` this package builds on landed in
    # 0.4.0. Keep this floor at a *released* version rather than raising it to
    # the current development version: nightlies are versioned `X.Y.ZaN`, which
    # PEP 440 orders *below* `X.Y.Z`, so a floor equal to the version being
    # developed would reject the matching nightly wheels.
    "sedonadb>=0.4.0",
    "sedonadb-expr>=0.4.0",
    "pyarrow",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
# GeoPandas interop is opt-in rather than a hard dependency. It routes through
# sedonadb's pandas/GeoPandas conversion, which needs geoarrow-pyarrow as well
# as geopandas itself — without it, anything calling to_geopandas() fails with
# `ModuleNotFoundError: No module named 'geoarrow'`.
#
# These are listed directly rather than as `sedonadb[geopandas]` so that
# installing this package can never cause pip to re-resolve sedonadb itself:
# in CI sedonadb is an editable build from source, and a resolver that decided
# to satisfy it from PyPI instead would quietly stop testing the source tree.
geopandas = [
    "geopandas",
    "geoarrow-pyarrow",
]
test = [
    "pytest",
    "pandas",
    "geopandas",
    "geoarrow-pyarrow",
]

[tool.hatch.version]
source = "code"
path = "_version.py"
expression = "get_version()"

[tool.hatch.build.targets.wheel]
packages = ["python/sedonadb_geopandas"]
